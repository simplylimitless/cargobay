apiVersion: v1
kind: Service
metadata:
  name: cargobay
  namespace: cargobay
spec:
  selector:
    app: cargobay
  ports:
    - port: 80
      targetPort: 4500
      protocol: TCP
  type: ClusterIP
---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cargobay-ingress
  namespace: cargobay
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: cargobay.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cargobay
                port:
                  number: 80
