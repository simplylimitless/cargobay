apiVersion: v1
kind: Secret
metadata:
  name: cargobay-postgres-secret
  namespace: cargobay
type: Opaque
data:
  # Base64 encoded password: password
  password: cGFzc3dvcmQ=
---
apiVersion: v1
kind: Service
metadata:
  name: cargobay-postgres
  namespace: cargobay
spec:
  selector:
    app: cargobay-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargobay-postgres
  namespace: cargobay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cargobay-postgres
  template:
    metadata:
      labels:
        app: cargobay-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: cargobay
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cargobay-postgres-secret
                  key: password
            - name: POSTGRES_DB
              value: cargobay
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
---
