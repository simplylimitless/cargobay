# cargobay Secret
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cargobay.fullname" . }}-secrets
  labels:
    {{- include "cargobay.labels" . | nindent 4 }}
type: Opaque
data:
  # Database password (base64 encoded)
  {{- if .Values.database.password }}
  database-password: {{ .Values.database.password | b64enc | quote }}
  {{- end }}
  # Redis password (optional, base64 encoded)
  {{- if .Values.redis.password }}
  redis-password: {{ .Values.redis.password | b64enc | quote }}
  {{- end }}
  # S3 credentials (base64 encoded)
  {{- if and .Values.storage.config.s3 .Values.storage.config.s3.accessKey }}
  s3-access-key: {{ .Values.storage.config.s3.accessKey | b64enc | quote }}
  s3-secret-key: {{ .Values.storage.config.s3.secretKey | b64enc | quote }}
  {{- end }}
  # Signing key (optional)
  {{- if .Values.security.signingKey }}
  signing-key: {{ .Values.security.signingKey | b64enc | quote }}
  {{- end }}
