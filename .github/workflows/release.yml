name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Create Release and Build Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get version from tag
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="v0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Build backend binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/cargobay-linux-amd64 ./cmd/server/main.go
          GOOS=linux GOARCH=arm64 go build -o dist/cargobay-linux-arm64 ./cmd/server/main.go
          GOOS=darwin GOARCH=amd64 go build -o dist/cargobay-darwin-amd64 ./cmd/server/main.go
          GOOS=darwin GOARCH=arm64 go build -o dist/cargobay-darwin-arm64 ./cmd/server/main.go
          GOOS=windows GOARCH=amd64 go build -o dist/cargobay-windows-amd64.exe ./cmd/server/main.go
          GOOS=windows GOARCH=arm64 go build -o dist/cargobay-windows-arm64.exe ./cmd/server/main.go

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          tag_name: ${{ steps.version.outputs.VERSION }}
          body: |
            ## Changes
            - See git log for details

            ## Installation
            Download the appropriate binary for your platform:

            - Linux: `curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/cargobay-linux-amd64 -o cargobay`
            - macOS (Intel): `curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/cargobay-darwin-amd64 -o cargobay`
            - macOS (Apple Silicon): `curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/cargobay-darwin-arm64 -o cargobay`
            - Windows: `curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/cargobay-windows-amd64.exe -o cargobay.exe`

            ## Docker
            ```bash
            docker run -p 4500:4500 ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ```

            ## Changelog
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
          files: |
            dist/*
            frontend/dist/*

      - name: Upload release assets
        uses: xresloader/upload-to-github-release@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_id: ${{ steps.version.outputs.VERSION }}
          file: dist/*
          file_glob: true
