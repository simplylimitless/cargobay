services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cargobay
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cargobay
    ports:
      - "5432:5432"
    volumes:
      # Local bind mount — point this at an NFS-mounted host path if needed,
      # but note NFS is not recommended for the live Postgres data directory
      # (fsync/locking semantics can cause corruption). Prefer local/block storage here.
      - ./data/postgres:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargobay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "4500:4500"
    environment:
      PORT: "4500"
      HOST: "0.0.0.0"
      DATABASE_URL: postgres://cargobay:password@postgres:5432/cargobay
      REDIS_URL: redis://redis:6379
    volumes:
      # Local bind mount for artifact storage — used when storage.type is "local"
      # in backend/config.yaml. Point this at an NFS mount if desired, or switch
      # storage.type to "s3"/"gcs" in config.yaml to bypass this path entirely.
      - ./data/artifacts:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5174:5174"
    depends_on:
      - backend
