services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cargobay
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cargobay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargobay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "4500:4500"
    environment:
      PORT: "4500"
      HOST: "0.0.0.0"
      DATABASE_URL: postgres://cargobay:password@postgres:5432/cargobay
      REDIS_URL: redis://redis:6379
    volumes:
      - backend-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  postgres-data:
  backend-storage:
