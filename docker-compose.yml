services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cargobay
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cargobay
    ports:
      - "5432:5432"
    volumes:
      # Deliberately its own top-level mount, separate from ./data/app -- Postgres
      # needs real fsync/locking guarantees, so this should stay on local/block
      # storage even if ./data/app ends up on NFS.
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargobay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  trivy:
    image: aquasec/trivy:latest
    # --cache-dir is passed explicitly (rather than relying on the default
    # ~/.cache/trivy) because this container runs as uid 1000 with no home
    # directory of its own -- same reason the mount target below isn't /root.
    command: server --listen 0.0.0.0:4954 --cache-dir /cache
    # Matches the backend container's non-root `app` user (uid/gid 1000) so
    # both containers can read/write the same shared cache directory without
    # permission conflicts.
    user: "1000:1000"
    volumes:
      # Trivy's own vulnerability-DB cache (pulled from ghcr.io/aquasecurity/trivy-db
      # and trivy-java-db, refreshed automatically on its own TTL). Lives under the
      # shared application volume alongside other non-artifact app state.
      - ./data/app/trivy-cache:/cache
    ports:
      - "4954:4954"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4500:4500"
    environment:
      PORT: "4500"
      HOST: "0.0.0.0"
      DATABASE_URL: postgres://cargobay:password@postgres:5432/cargobay
      REDIS_URL: redis://redis:6379
      # Shared with the `trivy` service's cache volume below, so both the
      # backend's own DB-refresh CLI calls and `trivy server`'s scans see
      # the same downloaded vulnerability DB.
      TRIVY_CACHE_DIR: /app/trivy-cache
      # Trivy scans Docker/OCI artifacts by pulling them back from cargobay's
      # own registry API, over the compose network.
      TRIVY_SERVER_ADDR: http://trivy:4954
      REGISTRY_ADDR: backend:4500
    volumes:
      # Local bind mount for artifact storage — used when storage.type is "local"
      # in backend/config.yaml. Point this at an NFS mount if desired, or switch
      # storage.type to "s3"/"gcs" in config.yaml to bypass this path entirely.
      - ./data/artifacts:/app/storage
      - ./data/app/trivy-cache:/app/trivy-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
